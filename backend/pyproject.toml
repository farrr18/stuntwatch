[project]
name = "stuntwatch"
version = "1.0.0"
description = "AI-based stunting risk early warning system for 514 Indonesian districts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy>=1.26,<2",
    "scikit-learn",
    "scipy",
    "xgboost",
    "shap",
    "fastapi",
    "uvicorn[standard]",
    "together",
    "requests",
    "xlsxwriter",
    "python-dotenv",
]

[project.scripts]
stuntwatch = "stuntwatch.cli.main:main"
stuntwatch-pipeline = "stuntwatch.data.pipeline:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
